<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat & Share</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #f0f2f5; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: white; border-radius: 24px; box-shadow: 0 8px 30px rgba(0,0,0,0.08); overflow: hidden; display: flex; flex-direction: column; height: 92vh; }
        .header { background: #6200EE; color: white; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 1.1rem; }
        .status { font-size: 0.85rem; display: flex; align-items: center; gap: 6px; font-weight: normal; opacity: 0.9; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-offline { background: #ff4d4d; }
        .dot-online { background: #4dff4d; }
        .content { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #fafafa; }
        .box { border: 1px solid #eef0f2; border-radius: 16px; padding: 16px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .box-title { font-size: 0.85rem; color: #666; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 5px; }
        .qr-area { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        #qrcode { padding: 10px; background: white; border: 1px dashed #ccc; border-radius: 8px; }
        .peer-id { font-family: monospace; font-size: 0.85rem; background: #f1f3f4; padding: 8px 16px; border-radius: 20px; word-break: break-all; text-align: center; width: 100%; color: #3c4043; }
        .btn { background: #6200EE; color: white; border: none; padding: 10px 20px; border-radius: 24px; font-weight: bold; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-secondary { background: white; color: #6200EE; border: 1.5px solid #6200EE; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .flex-row { display: flex; gap: 10px; width: 100%; }
        .input { flex: 1; padding: 10px 16px; border-radius: 24px; border: 1px solid #dadce0; outline: none; font-size: 0.9rem; transition: border-color 0.2s; }
        .input:focus { border-color: #6200EE; }
        .chat-area { height: 180px; overflow-y: auto; border: 1px solid #f1f3f4; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #fdfdfd; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; word-break: break-word; line-height: 1.4; }
        .msg-sent { background: #6200EE; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg-received { background: #f1f3f4; color: #202124; align-self: flex-start; border-bottom-left-radius: 4px; }
        .file-list { display: flex; flex-direction: column; gap: 8px; max-height: 180px; overflow-y: auto; }
        .file-item { display: flex; flex-direction: column; background: #f8f9fa; padding: 10px 12px; border-radius: 12px; border: 1px solid #f1f3f4; }
        .file-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; font-size: 0.85rem; }
        .progress-container { background: #e8eaed; height: 6px; border-radius: 3px; overflow: hidden; width: 100%; }
        .progress-bar { background: #6200EE; height: 100%; width: 0%; transition: width 0.1s linear; }
        .footer { padding: 12px; border-top: 1px solid #f1f3f4; display: flex; gap: 10px; background: white; align-items: center; }
        #fileInput { display: none; }
        .clip-btn { background: #f1f3f4; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .clip-btn:hover { background: #e8eaed; }
        .send-btn { background: #6200EE; color: white; border: none; width: 42px; height: 42px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        
        /* Scanner Modal styling */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
        .modal-body { background: white; padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>P2P Chat & Share</span>
        <div class="status">
            <span class="dot dot-offline" id="statusDot"></span>
            <span id="statusText">Offline</span>
        </div>
    </div>

    <div class="content">
        <div class="box qr-area">
            <div class="box-title">Your Connection QR</div>
            <div id="qrcode"></div>
            <div class="peer-id" id="myIdDisplay">Generating Connection ID...</div>
            <div class="flex-row" style="justify-content: center;">
                <button class="btn btn-secondary" id="btnScan">📷 Scan QR</button>
                <button class="btn btn-secondary" id="btnCopy">📋 Copy ID</button>
            </div>
            <div class="flex-row">
                <input type="text" class="input" id="remoteIdInput" placeholder="Or paste Peer ID here...">
                <button class="btn" id="btnConnect">Connect</button>
            </div>
        </div>

        <div class="box">
            <div class="box-title" id="chatTitle">Chat</div>
            <div class="chat-area" id="chatArea">
                <div style="color:#aaa; text-align:center; font-style:italic; font-size:0.85rem; margin:auto;">Connect with someone to start chatting</div>
            </div>
        </div>

        <div class="box">
            <div class="box-title" style="display:flex; justify-content:space-between; align-items:center;">
                <span>Shared Files <span id="fileCount"></span></span>
                <button class="btn btn-secondary" style="padding:5px 12px; font-size:0.75rem;" id="btnDownloadAll" disabled>Download All</button>
            </div>
            <div class="file-list" id="fileList">
                <div style="color:#aaa; text-align:center; font-style:italic; font-size:0.8rem;">No files shared yet</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="clip-btn" id="btnClip">📎</button>
        <input type="file" id="fileInput" multiple>
        <input type="text" class="input" id="chatInput" placeholder="Type a message...">
        <button class="send-btn" id="btnSend">✈️</button>
    </div>
</div>

<div class="modal" id="scannerModal">
    <div class="modal-body">
        <div style="font-weight:bold; text-align:center;">Scan QR Code</div>
        <div id="reader"></div>
        <button class="btn btn-secondary" id="btnCancelScan" style="margin:0 auto;">Close Camera</button>
    </div>
</div>

<script>
    const CHUNK_SIZE = 60 * 1024; // Reliable 60KB packet chunking
    let peer = null, conn = null, myId = null;
    let fileQueue = [], isSending = false, receivedFiles = [];
    let currentFileBuffer = null, activeFileId = null;
    let html5QrcodeScanner = null;

    const $ = id => document.getElementById(id);

    function init() {
        peer = new Peer();
        
        peer.on('open', id => {
            myId = id;
            $('myIdDisplay').textContent = id;
            $('statusDot').className = 'dot dot-online';
            $('statusText').textContent = 'Online';
            $('qrcode').innerHTML = '';
            new QRCode($('qrcode'), { text: id, width: 130, height: 130 });
        });

        peer.on('connection', setupConnection);
        peer.on('error', err => {
            console.error(err);
            $('statusDot').className = 'dot dot-offline';
            $('statusText').textContent = 'Disconnected/Error';
        });
    }

    function setupConnection(connection) {
        conn = connection;
        conn.on('open', () => {
            $('statusDot').className = 'dot dot-online';
            $('statusText').textContent = 'Connected';
            $('chatTitle').textContent = "Chat (Connected)";
            $('chatArea').innerHTML = '';
        });

        conn.on('data', data => {
            if (typeof data === 'string') {
                try {
                    const msg = JSON.parse(data);
                    handleJson(msg);
                } catch(e) {}
            } else {
                handleChunk(data instanceof Uint8Array ? data.buffer : data);
            }
        });

        conn.on('close', () => {
            $('statusDot').className = 'dot dot-offline';
            $('statusText').textContent = 'Disconnected';
            $('chatTitle').textContent = "Chat";
        });
    }

    function handleJson(msg) {
        if (msg.type === 'msg') {
            appendMsg(msg.val, 'received');
        } else if (msg.type === 'file-start') {
            const f = { id: msg.id, name: msg.name, size: msg.size, total: msg.total, received: 0, chunks: [] };
            receivedFiles.push(f);
            renderFiles();
            // Pull the very first chunk dynamically
            conn.send(JSON.stringify({ type: 'pull', id: msg.id, index: 0 }));
        } else if (msg.type === 'pull') {
            if (activeFileId === msg.id) sendChunk(msg.index);
        } else if (msg.type === 'file-end') {
            const f = receivedFiles.find(x => x.id === msg.id);
            if (f) {
                f.blob = new Blob(f.chunks);
                f.done = true;
                renderFiles();
                conn.send(JSON.stringify({ type: 'ack' }));
            }
        } else if (msg.type === 'ack') {
            isSending = false;
            processQueue();
        }
    }

    function handleChunk(buffer) {
        const f = receivedFiles[receivedFiles.length - 1];
        if (f && !f.done) {
            f.chunks.push(buffer);
            f.received++;
            
            const pBar = $('p-' + f.id);
            const pPct = $('pct-' + f.id);
            const pctVal = Math.round((f.received / f.total) * 100) + '%';
            if (pBar) pBar.style.width = pctVal;
            if (pPct) pPct.textContent = pctVal;
            
            if (f.received < f.total) {
                // Next specific item requested sequentially (Backpressure Proof)
                conn.send(JSON.stringify({ type: 'pull', id: f.id, index: f.received }));
            }
        }
    }

    function sendChunk(idx) {
        if (!conn || !conn.open) return;
        const start = idx * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, currentFileBuffer.byteLength);
        conn.send(currentFileBuffer.slice(start, end));
    }

    function processQueue() {
        if (isSending || fileQueue.length === 0) return;
        isSending = true;
        const file = fileQueue.shift();
        activeFileId = 'f-' + Math.random().toString(36).substr(2, 9);
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

        const reader = new FileReader();
        reader.onload = e => {
            currentFileBuffer = e.target.result;
            conn.send(JSON.stringify({ type: 'file-start', id: activeFileId, name: file.name, size: file.size, total: totalChunks }));
        };
        reader.readAsArrayBuffer(file);
    }

    function appendMsg(text, type) {
        const div = document.createElement('div');
        div.className = `msg msg-${type}`;
        div.textContent = text;
        $('chatArea').appendChild(div);
        $('chatArea').scrollTop = $('chatArea').scrollHeight;
    }

    function renderFiles() {
        if (receivedFiles.length === 0) return;
        $('fileList').innerHTML = receivedFiles.map(f => `
            <div class="file-item">
                <div class="file-info-row">
                    <span style="max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500;">${f.name}</span>
                    <span id="pct-${f.id}" style="font-weight:bold; color:${f.done ? 'green' : '#f57c00'};">${f.done ? 'Ready' : '0%'}</span>
                </div>
                ${!f.done ? `<div class="progress-container"><div class="progress-bar" id="p-${f.id}"></div></div>` : ''}
            </div>
        `).join('');
        
        const completes = receivedFiles.filter(x => x.done).length;
        $('btnDownloadAll').disabled = completes === 0;
        $('fileCount').textContent = completes > 0 ? `(${completes} ready)` : '';
    }

    $('btnConnect').addEventListener('click', () => {
        const id = $('remoteIdInput').value.trim();
        if (id) setupConnection(peer.connect(id));
    });

    $('btnSend').addEventListener('click', () => {
        const txt = $('chatInput').value.trim();
        if (txt && conn && conn.open) {
            conn.send(JSON.stringify({ type: 'msg', val: txt }));
            appendMsg(txt, 'sent');
            $('chatInput').value = '';
        }
    });

    $('btnClip').addEventListener('click', () => { if(conn && conn.open) $('fileInput').click(); });
    $('fileInput').addEventListener('change', () => {
        if ($('fileInput').files.length) {
            fileQueue.push(...Array.from($('fileInput').files));
            processQueue();
        }
    });

    $('btnCopy').addEventListener('click', () => {
        if (myId) { navigator.clipboard.writeText(myId); alert('ID Copied!'); }
    });

    // Camera Scan Logic
    $('btnScan').addEventListener('click', () => {
        $('scannerModal').style.display = 'flex';
        html5QrcodeScanner = new Html5Qrcode("reader");
        html5QrcodeScanner.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 250 },
            qrCodeMessage => {
                $('remoteIdInput').value = qrCodeMessage;
                stopScanner();
                setupConnection(peer.connect(qrCodeMessage.trim()));
            },
            errorMessage => {}
        ).catch(err => console.log(err));
    });

    $('btnCancelScan').addEventListener('click', stopScanner);

    function stopScanner() {
        $('scannerModal').style.display = 'none';
        if (html5QrcodeScanner) {
            html5QrcodeScanner.stop().then(() => html5QrcodeScanner.clear()).catch(err => console.log(err));
        }
    }

    $('btnDownloadAll').addEventListener('click', async () => {
        const ready = receivedFiles.filter(x => x.done && x.blob);
        if (ready.length === 1) {
            triggerDL(ready[0].blob, ready[0].name);
        } else {
            const zip = new JSZip();
            ready.forEach(x => zip.file(x.name, x.blob));
            const c = await zip.generateAsync({ type: 'blob' });
            triggerDL(c, `shared-files-${Date.now()}.zip`);
        }
    });

    function triggerDL(b, n) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click();
    }

    init();
</script>
</body>
</html>
