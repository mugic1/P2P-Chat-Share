<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Chat & Share</title>
    <script src="https://unpkg.com/peerjs@1.5.1/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #fafafa; color: #333; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; background: white; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e0e0e0; display: flex; flex-direction: column; height: 95vh; }
        .header { background: #6200EE; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .status { font-size: 0.85rem; display: flex; align-items: center; gap: 5px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot-offline { background: #ff4d4d; }
        .dot-online { background: #4dff4d; }
        .content { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .box { border: 1px solid #e0e0e0; border-radius: 12px; padding: 15px; background: #fff; }
        .box-title { font-size: 0.85rem; color: #666; font-weight: bold; margin-bottom: 10px; }
        .qr-area { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        #qrcode { padding: 10px; background: white; }
        .peer-id { font-family: monospace; font-size: 0.85rem; background: #f5f5f5; padding: 6px 12px; border-radius: 20px; word-break: break-all; text-align: center; width: 100%; }
        .btn { background: #6200EE; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .btn-secondary { background: white; color: #6200EE; border: 1.5px solid #6200EE; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .flex-row { display: flex; gap: 8px; width: 100%; }
        .input { flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #ccc; outline: none; font-size: 0.9rem; }
        .chat-area { height: 180px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: #fbfbfb; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 15px; font-size: 0.9rem; word-break: break-word; }
        .msg-sent { background: #6200EE; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-received { background: #eee; color: #333; align-self: flex-start; border-bottom-left-radius: 2px; }
        .file-list { display: flex; flex-direction: column; gap: 6px; max-height: 150px; overflow-y: auto; }
        .file-item { display: flex; justify-content: space-between; align-items: center; background: #f5f5f5; padding: 8px 12px; border-radius: 6px; font-size: 0.8rem; }
        .progress-container { flex: 1; margin: 0 10px; background: #ddd; height: 5px; border-radius: 3px; overflow: hidden; }
        .progress-bar { background: #6200EE; height: 100%; width: 0%; }
        .footer { padding: 10px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px; background: white; align-items: center; }
        #fileInput { display: none; }
        .clip-btn { background: #eee; border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <span>P2P Chat & Share</span>
        <div class="status">
            <span class="dot dot-offline" id="statusDot"></span>
            <span id="statusText">Offline</span>
        </div>
    </div>

    <div class="content">
        <div class="box qr-area">
            <div id="qrcode"></div>
            <div class="peer-id" id="myIdDisplay">Connecting to server...</div>
            <div class="flex-row" style="justify-content: center;">
                <button class="btn btn-secondary" id="btnCopy">Copy ID</button>
            </div>
            <div class="flex-row">
                <input type="text" class="input" id="remoteIdInput" placeholder="Paste Peer ID here...">
                <button class="btn" id="btnConnect">Connect</button>
            </div>
        </div>

        <div class="box">
            <div class="box-title" id="chatTitle">Chat</div>
            <div class="chat-area" id="chatArea">
                <div style="color:#aaa; text-align:center; font-style:italic; font-size:0.85rem; margin:auto;">Connect with someone to start chatting</div>
            </div>
        </div>

        <div class="box">
            <div class="box-title" style="display:flex; justify-content:space-between; align-items:center;">
                <span>Shared Files <span id="fileCount"></span></span>
                <button class="btn btn-secondary" style="padding:4px 10px; font-size:0.75rem;" id="btnDownloadAll" disabled>Download All</button>
            </div>
            <div class="file-list" id="fileList">
                <div style="color:#aaa; text-align:center; font-style:italic; font-size:0.8rem;">No files shared yet</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="clip-btn" id="btnClip">📎</button>
        <input type="file" id="fileInput" multiple>
        <input type="text" class="input" id="chatInput" placeholder="Type a message...">
        <button class="btn" id="btnSend" style="border-radius: 50%; width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center;">✈️</button>
    </div>
</div>

<script>
    const CHUNK_SIZE = 60 * 1024; // 60KB chunks
    let peer = null, conn = null, myId = null;
    let fileQueue = [], isSending = false, receivedFiles = [];
    let currentFileBuffer = null, activeFileId = null;

    // Elements
    const $ = id => document.getElementById(id);

    function init() {
        peer = new Peer();
        
        peer.on('open', id => {
            myId = id;
            $('myIdDisplay').textContent = id;
            $('statusDot').className = 'dot dot-online';
            $('statusText').textContent = 'Online';
            $('qrcode').innerHTML = '';
            new QRCode($('qrcode'), { text: id, width: 120, height: 120 });
        });

        peer.on('connection', setupConnection);
        peer.on('error', () => {
            $('statusDot').className = 'dot dot-offline';
            $('statusText').textContent = 'Error/Offline';
        });
    }

    function setupConnection(connection) {
        conn = connection;
        conn.on('open', () => {
            $('statusText').textContent = 'Connected';
            $('chatTitle').textContent = "Chat (Connected)";
            $('chatArea').innerHTML = '';
        });

        conn.on('data', data => {
            if (typeof data === 'string') {
                try {
                    const msg = JSON.parse(data);
                    handleJson(msg);
                } catch(e) {}
            } else {
                handleChunk(data instanceof Uint8Array ? data.buffer : data);
            }
        });

        conn.on('close', () => {
            $('statusText').textContent = 'Disconnected';
            $('chatTitle').textContent = "Chat";
        });
    }

    function handleJson(msg) {
        if (msg.type === 'msg') {
            appendMsg(msg.val, 'received');
        } else if (msg.type === 'file-start') {
            const f = { id: msg.id, name: msg.name, size: msg.size, total: msg.total, received: 0, chunks: [] };
            receivedFiles.push(f);
            renderFiles();
            conn.send(JSON.stringify({ type: 'pull', id: msg.id, index: 0 }));
        } else if (msg.type === 'pull') {
            if (activeFileId === msg.id) sendChunk(msg.index);
        } else if (msg.type === 'file-end') {
            const f = receivedFiles.find(x => x.id === msg.id);
            if (f) {
                const blob = new Blob(f.chunks);
                f.blob = blob;
                f.done = true;
                renderFiles();
                conn.send(JSON.stringify({ type: 'ack' }));
            }
        } else if (msg.type === 'ack') {
            isSending = false;
            processQueue();
        }
    }

    function handleChunk(buffer) {
        const f = receivedFiles[receivedFiles.length - 1];
        if (f && !f.done) {
            f.chunks.push(buffer);
            f.received++;
            const pBar = $('p-' + f.id);
            if (pBar) pBar.style.width = Math.round((f.received / f.total) * 100) + '%';
            
            if (f.received < f.total) {
                conn.send(JSON.stringify({ type: 'pull', id: f.id, index: f.received }));
            }
        }
    }

    function sendChunk(idx) {
        if (!conn || !conn.open) return;
        const start = idx * CHUNK_SIZE;
        const end = Math.min(start + CHUNK_SIZE, currentFileBuffer.byteLength);
        conn.send(currentFileBuffer.slice(start, end));
    }

    function processQueue() {
        if (isSending || fileQueue.length === 0) return;
        isSending = true;
        const file = fileQueue.shift();
        activeFileId = 'f-' + Math.random().toString(36).substr(2, 9);
        const totalChunks = Math.ceil(file.size / CHUNK_SIZE);

        const reader = new FileReader();
        reader.onload = e => {
            currentFileBuffer = e.target.result;
            conn.send(JSON.stringify({ type: 'file-start', id: activeFileId, name: file.name, size: file.size, total: totalChunks }));
        };
        reader.readAsArrayBuffer(file);
    }

    function appendMsg(text, type) {
        const div = document.createElement('div');
        div.className = `msg msg-${type}`;
        div.textContent = text;
        $('chatArea').appendChild(div);
        $('chatArea').scrollTop = $('chatArea').scrollHeight;
    }

    function renderFiles() {
        if (receivedFiles.length === 0) return;
        $('fileList').innerHTML = receivedFiles.map(f => `
            <div class="file-item">
                <span style="max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${f.name}</span>
                ${!f.done ? `<div class="progress-container"><div class="progress-bar" id="p-${f.id}"></div></div>` : '<span style="color:green;font-weight:bold;">Ready</span>'}
            </div>
        `).join('');
        
        const completes = receivedFiles.filter(x => x.done).length;
        $('btnDownloadAll').disabled = completes === 0;
        $('fileCount').textContent = completes > 0 ? `(${completes} ready)` : '';
    }

    $('btnConnect').addEventListener('click', () => {
        const id = $('remoteIdInput').value.trim();
        if (id) setupConnection(peer.connect(id));
    });

    $('btnSend').addEventListener('click', () => {
        const txt = $('chatInput').value.trim();
        if (txt && conn && conn.open) {
            conn.send(JSON.stringify({ type: 'msg', val: txt }));
            appendMsg(txt, 'sent');
            $('chatInput').value = '';
        }
    });

    $('btnClip').addEventListener('click', () => { if(conn && conn.open) $('fileInput').click(); });
    $('fileInput').addEventListener('change', () => {
        if ($('fileInput').files.length) {
            fileQueue.push(...Array.from($('fileInput').files));
            processQueue();
        }
    });

    $('btnCopy').addEventListener('click', () => {
        if (myId) { navigator.clipboard.writeText(myId); alert('ID Copied!'); }
    });

    $('btnDownloadAll').addEventListener('click', async () => {
        const ready = receivedFiles.filter(x => x.done && x.blob);
        if (ready.length === 1) {
            triggerDL(ready[0].blob, ready[0].name);
        } else {
            const zip = new JSZip();
            ready.forEach(x => zip.file(x.name, x.blob));
            const c = await zip.generateAsync({ type: 'blob' });
            triggerDL(c, `shared-files-${Date.now()}.zip`);
        }
    });

    function triggerDL(b, n) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = n; a.click();
    }

    init();
</script>
</body>
</html>
