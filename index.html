<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Share</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --text: #f1f5f9; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: var(--card); padding: 24px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        h2 { text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--accent); }
        .id-section { background: #334155; padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; border: 1px solid #475569; }
        #qrcode { background: white; padding: 10px; border-radius: 12px; width: fit-content; margin: 15px auto; }
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input, textarea { flex: 1; padding: 14px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
        button { padding: 12px 20px; border-radius: 12px; border: none; background: var(--accent); color: #0f172a; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-send { width: 100%; margin-bottom: 10px; }
        .btn-file { width: 100%; background: #10b981; color: white; }
        #transfer-list { margin-top: 25px; border-top: 1px solid #334155; padding-top: 20px; }
        .msg-item { background: #334155; padding: 16px; border-radius: 14px; margin-bottom: 12px; border-left: 4px solid var(--accent); }
        .msg-header { font-size: 0.75rem; color: var(--accent); margin-bottom: 8px; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; gap: 5px; }
        .msg-content { font-size: 0.95rem; line-height: 1.5; margin-bottom: 12px; color: #cbd5e1; }
        .btn-action { padding: 6px 12px; font-size: 0.8rem; background: #475569; color: white; text-decoration: none; border-radius: 8px; display: inline-flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2><i data-lucide="shield-check"></i> Private Share</h2>
    
    <div class="id-section">
        <small>Aapki ID (Scan to Connect):</small>
        <div id="my-id" style="font-weight: bold; margin: 8px 0; font-size: 1.1rem;">Wait...</div>
        <div id="qrcode"></div>
    </div>

    <div class="input-group">
        <input type="text" id="target-id" placeholder="Paste Partner's ID">
        <button onclick="connectToPeer()"><i data-lucide="link"></i> Connect</button>
    </div>

    <textarea id="text-msg" placeholder="Write something..."></textarea>
    <button class="btn-send" onclick="sendText()"><i data-lucide="send"></i> Send Text</button>
    
    <input type="file" id="file-input" style="display:none" onchange="sendFile()">
    <button class="btn-file" onclick="document.getElementById('file-input').click()"><i data-lucide="image"></i> Send File / Video</button>

    <div id="transfer-list"></div>
</div>

<script>
    const peer = new Peer();
    let conn;

    peer.on('open', id => {
        document.getElementById('my-id').innerText = id;
        new QRCode(document.getElementById("qrcode"), { text: id, width: 120, height: 120 });
    });

    peer.on('connection', connection => {
        conn = connection;
        setupConn();
    });

    function connectToPeer() {
        const tid = document.getElementById('target-id').value;
        if(!tid) return alert("ID daalein!");
        conn = peer.connect(tid, { reliable: true });
        setupConn();
    }

    function setupConn() {
        conn.on('open', () => {
            document.querySelector('h2').style.color = "#10b981";
            document.querySelector('h2').innerHTML = '<i data-lucide="zap"></i> Connected!';
            lucide.createIcons();
        });
        conn.on('data', data => handleIncoming(data));
    }

    function handleIncoming(data) {
        const list = document.getElementById('transfer-list');
        const div = document.createElement('div');
        div.className = 'msg-item';

        if (data.type === 'text') {
            div.innerHTML = `
                <div class="msg-header"><i data-lucide="message-square"></i> Text Received</div>
                <div class="msg-content">${data.content}</div>
                <button class="btn-action" onclick="copyText(this, '${data.content}')"><i data-lucide="copy"></i> Copy</button>
            `;
        } else if (data.type === 'file') {
            const blob = new Blob([data.content]);
            const url = URL.createObjectURL(blob);
            div.innerHTML = `
                <div class="msg-header"><i data-lucide="file-text"></i> File Received</div>
                <div class="msg-content"><b>${data.name}</b><br><small>${(data.size/1024/1024).toFixed(2)} MB</small></div>
                <a href="${url}" download="${data.name}" class="btn-action"><i data-lucide="download"></i> Download</a>
            `;
        }
        list.prepend(div);
        lucide.createIcons();
    }

    function sendText() {
        const val = document.getElementById('text-msg').value;
        if(conn && val) {
            conn.send({ type: 'text', content: val });
            document.getElementById('text-msg').value = '';
            addLog('Sent', val, 'send');
        }
    }

    function sendFile() {
        const file = document.getElementById('file-input').files[0];
        if(conn && file) {
            conn.send({ type: 'file', content: file, name: file.name, size: file.size });
            addLog('Sent File', file.name, 'file-up');
        }
    }

    function addLog(type, content, icon) {
        const list = document.getElementById('transfer-list');
        const div = document.createElement('div');
        div.className = 'msg-item';
        div.style.opacity = '0.6';
        div.innerHTML = `<div class="msg-header"><i data-lucide="${icon}"></i> ${type}</div><div class="msg-content">${content}</div>`;
        list.prepend(div);
        lucide.createIcons();
    }

    function copyText(btn, text) {
        navigator.clipboard.writeText(text);
        btn.innerHTML = '<i data-lucide="check"></i> Copied!';
        lucide.createIcons();
        setTimeout(() => { btn.innerHTML = '<i data-lucide="copy"></i> Copy'; lucide.createIcons(); }, 2000);
    }

    lucide.createIcons();
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
    }
</script>
</body>
</html>
